name: AI Engineer podcast

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
    inputs:
      max_new:
        description: "Max new episodes this run (blank = config default)"
        required: false
      scan_limit:
        description: "How many recent uploads to scan (blank = config default)"
        required: false
  push:
    branches: [main]
    paths: ["podcast/config.toml"]

permissions:
  contents: write # commit episodes.json, create releases for the audio
  pages: write
  id-token: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # yt-dlp needs a JavaScript runtime to solve YouTube's player challenges.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -U -r podcast/requirements.txt

      # YouTube blocks GitHub's data-centre IPs ("Sign in to confirm you're not
      # a bot"). Cloudflare's free WARP client in proxy mode gives yt-dlp a
      # Cloudflare exit IP instead; nothing else on the runner uses it.
      # Skipped when a YT_PROXY secret is configured.
      - name: Start Cloudflare WARP proxy
        continue-on-error: true
        env:
          USER_PROXY: ${{ secrets.YT_PROXY }}
        run: |
          [ -n "$USER_PROXY" ] && { echo "YT_PROXY secret set; not using WARP"; exit 0; }
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          for i in $(seq 1 15); do warp-cli --accept-tos status >/dev/null 2>&1 && break; sleep 2; done
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          for i in $(seq 1 30); do
            if curl -fsS -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on'; then
              echo "WARP proxy up"
              echo "YT_PROXY=socks5h://127.0.0.1:40000" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          warp-cli --accept-tos status
          echo "::warning::WARP proxy did not come up; downloading without it"

      - name: Download new episodes
        env:
          GH_TOKEN: ${{ github.token }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YT_PROXY: ${{ secrets.YT_PROXY || env.YT_PROXY }}
        run: |
          args=()
          [ -n "${{ inputs.max_new }}" ] && args+=(--max-new "${{ inputs.max_new }}")
          [ -n "${{ inputs.scan_limit }}" ] && args+=(--scan-limit "${{ inputs.scan_limit }}")
          python podcast/podcast.py sync "${args[@]}"

      - name: Save episode list
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in podcast/episodes.json podcast/cover.jpg; do [ -f "$f" ] && git add "$f"; done
          if ! git diff --cached --quiet; then
            git commit -m "podcast: update episodes [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Build feed
        if: always()
        env:
          PODCAST_OWNER_EMAIL: ${{ secrets.PODCAST_OWNER_EMAIL }}
        run: python podcast/podcast.py feed --out podcast/public

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: podcast/public

  # Separate job so a Pages problem never stops episodes being downloaded.
  deploy:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
